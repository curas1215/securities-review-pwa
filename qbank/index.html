<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0b0f"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="证券刷题"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="../assets/icon-180.png"><title>证券分析师刷题 · 安装</title>
<style>body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;background:#f5f5f7;margin:0}.wrap{max-width:640px;margin:auto;padding:20px}.card{background:white;border-radius:20px;padding:20px;margin:15px 0}.hero{background:#0b0b0f;color:white;border-radius:24px;padding:24px}.btn,.file{display:block;width:100%;padding:14px;border-radius:14px;border:0;text-align:center;font-size:16px;font-weight:700;margin-top:12px;background:#0b0b0f;color:white}.file{background:#eee;color:#111}#bar{height:8px;background:#111;width:0}.progress{background:#eee;height:8px;margin-top:10px}.ok{color:green}.err{color:red}</style>
</head>
<body><div class="wrap"><div class="hero"><h1>证券分析师刷题</h1><p>720题 · 6套卷 · 随机刷题 · 错题 · 套题考试 · iPhone离线PWA</p></div><div class="card"><h2>首次导入完整题库</h2><div id="status">检查中...</div><p>完整题库 ZIP 只保存在当前设备。导入后包含全部720题和1600个原题/解析媒体资源。</p><label class="file" for="zip">选择完整 ZIP</label><input id="zip" type="file" accept=".zip" hidden><div class="progress"><div id="bar"></div></div><div id="detail"></div><button id="open" class="btn" hidden>打开刷题软件</button></div><div class="card"><h2>iPhone安装</h2><ol><li>Safari打开此页面</li><li>导入完整ZIP</li><li>点击添加到主屏幕</li><li>以后离线刷题</li></ol></div></div>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script><script>
const C='qbank-runtime-v1.0.0';const $=x=>document.getElementById(x);function u(x){return new URL('./runtime/'+x,location.href).href}async function init(){await navigator.serviceWorker.register('./loader-sw.js');await navigator.serviceWorker.ready}init();
async function imp(f){let z=await JSZip.loadAsync(f),pre='securities_qbank_pwa/',q=JSON.parse(await z.file(pre+'data/questions.json').async('text'));let media=Object.keys(z.files).filter(x=>x.startsWith(pre+'assets/')&&x.endsWith('.webp'));if(q.length!==720||media.length!==1600)throw Error('校验失败');let c=await caches.open(C),arr=Object.keys(z.files).filter(x=>x.startsWith(pre)&&!z.files[x].dir&&x.slice(pre.length)!=='sw.js'),n=0;for(let x of arr){let r=x.slice(pre.length),b=await z.file(x).async('blob');await c.put(u(r),new Response(b));$('bar').style.width=Math.round(++n/arr.length*100)+'%'}$('status').textContent='导入完成';$('status').className='ok';$('open').hidden=false}$('zip').onchange=e=>imp(e.target.files[0]).catch(e=>{$('status').textContent=e.message;$('status').className='err'});$('open').onclick=()=>location.href='./runtime/';
</script></body></html>
